[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "incidentbridge"
version = "0.1.0"
description = "Vendor-neutral incident event validation and normalization"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2", "build>=1.2,<2", "jsonschema>=4.23,<5"]

[project.scripts]
incidentbridge = "incidentbridge.cli:main"

[project.urls]
Repository = "https://github.com/tanvir4hmed/incidentbridge"

[tool.hatch.build.targets.wheel]
packages = ["src/incidentbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
