name: Package CI
on:
  push:
    paths: ["src/**", "tests/**", "examples/**", "fixtures/**", "schemas/**", "pyproject.toml", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "examples/**", "fixtures/**", "schemas/**", "pyproject.toml", ".github/workflows/ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests examples
      - run: mypy src
      - run: pytest -q
      - run: python -m build
      - run: python -m pip freeze > dist/ci-dependencies.txt
      - name: Clean wheel installation and CLI verification
        run: |
          python -m venv /tmp/incidentbridge-smoke
          /tmp/incidentbridge-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/incidentbridge-smoke/bin/incidentbridge validate "$GITHUB_WORKSPACE/fixtures/smoke.json" --adapter sensor
          /tmp/incidentbridge-smoke/bin/incidentbridge emit "$GITHUB_WORKSPACE/fixtures/camera.json" --adapter camera-simulator
          /tmp/incidentbridge-smoke/bin/incidentbridge replay "$GITHUB_WORKSPACE/fixtures/scenario.jsonl"
          /tmp/incidentbridge-smoke/bin/incidentbridge schema > "$GITHUB_WORKSPACE/dist/incident-event.schema.json"
          diff "$GITHUB_WORKSPACE/schemas/incident-event.schema.json" "$GITHUB_WORKSPACE/dist/incident-event.schema.json"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: incidentbridge-python-${{ matrix.python }}
          path: dist/
